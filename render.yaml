services:
  - type: web
    name: nexovara-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AURORA_PUBLIC_URL
        value: https://joseph-web-max.github.io/AURORA-AI-v2/
      - key: MFA_REQUIRED_FOR_STAFF
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: nexovara-private
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
      - key: AURORA_BASE_URL
        sync: false
      - key: AURORA_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_CURRENCY
        value: KES
      - key: DEFAULT_LOCALE
        value: en
      - key: DEFAULT_TIMEZONE
        value: Africa/Nairobi
        
